name = "vps-dog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vps-dog"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# `true` (not just ["/api/*"]) so the SPA shell is rendered by the Worker and
# the `custom_head` setting can be injected. Static assets are still served by
# the binding; the settings read happens only for text/html responses, so JS/CSS
# requests cost one extra internal fetch and no D1 query.
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
