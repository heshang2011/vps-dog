name = "vps-dog"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 database. The placeholder `database_id` is intentional: the Deploy to
# Cloudflare button provisions a real database and rewrites this value in the
# user's cloned repository. Keep the key present or provisioning has nothing to
# bind to.
[[d1_databases]]
binding = "DB"
database_name = "vps-dog"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# `true` so the SPA shell is rendered by the Worker and the `custom_head`
# setting can be injected. Static assets are still served by the binding.
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
