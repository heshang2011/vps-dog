name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  agent-binaries:
    name: Build agent binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix
        working-directory: agent
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          build() {
            os=$1; arch=$2; name=$3
            echo "→ $name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION" -o "dist/$name" .
          }
          build linux  amd64 vps-dog-linux-amd64
          build linux  arm64 vps-dog-linux-arm64
          build linux  arm   vps-dog-linux-armv7
          build linux  386   vps-dog-linux-386
          build darwin amd64 vps-dog-darwin-amd64
          build darwin arm64 vps-dog-darwin-arm64
          build windows amd64 vps-dog-windows-amd64.exe
          cd dist
          sha256sum * > checksums.txt
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent/dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            agent/dist/*
            agent/install.sh
